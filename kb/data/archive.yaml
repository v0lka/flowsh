version: effect-kb/v2
# ---------------------------------------------------------------------------
# Archives and compression.
#
# Sources: the gzip(1), gunzip(1), zcat(1), bzip2(1), bunzip2(1), xz(1),
# unxz(1), zstd(1), compress(1), uncompress(1), zip(1), unzip(1), 7z(1),
# rar(1), unrar(1), cpio(1), pax(1), ar(1), genisoimage(1), mkisofs(1) and
# isoinfo(1) manuals.
#
# A compressor or archiver reads its inputs and writes its outputs, so its
# parameters carry FSRead and FSWrite effects; parameters that stream the result
# to standard output carry Stdio instead. Flags that overwrite existing output
# or rewrite an archive in place are recorded as FSWrite and are additionally
# listed in the destructive table (kb/data/destructive.yaml).
#
# Dialect note: every entry is documented against the `archive` dialect, the
# family shared by the archivers and compressors (POSIX-specified and GNU alike).
# ---------------------------------------------------------------------------
commands:
  # --- single-file compressors -------------------------------------------------
  - name: gzip
    dialect: archive
    params:
      - spec: "-d"
        kind: flag
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: "--decompress"
        kind: flag
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: "-c"
        kind: flag
        effect: {kind: Stdio, mode: Direct, valueFrom: args}
      - spec: "--stdout"
        kind: flag
        effect: {kind: Stdio, mode: Direct, valueFrom: args}
      - spec: "-f"
        kind: flag
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: "-k"
        kind: flag
        effect: {kind: FSMeta, mode: Direct, valueFrom: args}
      - spec: "-l"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-t"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-r"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-9"
        kind: flag
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: "-S"
        kind: option
        effect: {kind: FSMeta, mode: Direct, valueFrom: flagValue}
      - spec: FILE
        kind: positional
        effect: {kind: FSRead, mode: Direct, valueFrom: args}

