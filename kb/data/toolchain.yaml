  # --- Rust ecosystem tooling ----------------------------------------------
  # The Rust toolchain beyond cargo/rustc (pkgmgr.yaml): the toolchain manager
  # (rustup), the documentation generator (rustdoc), the language server
  # (rust-analyzer), the test runner (nextest), the cargo subcommand binaries
  # (cargo-audit, cargo-deny, cargo-watch, cargo-expand, cargo-tarpaulin), the
  # wasm toolchain (wasm-pack, trunk), the cross-compilation wrapper (cross)
  # and the background checker (bacon).  The rustfmt formatter lives in
  # linting.yaml (the `build` dialect).  A compiler/doc generator reads sources
  # (FSRead) and writes output (FSWrite); a test/build driver spawns the
  # toolchain (ProcSpawn) or runs its target (CodeExec); a command that reaches
  # the network — the advisory-database fetch, a registry publish, a toolchain
  # download — is NetEgress; a local store/manifest write is FSWrite; a
  # dev/preview server listens (NetIngress); version/help is Stdio/FSRead.
  - name: rustup
    dialect: pkgmgr
    params:
      - spec: install
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: uninstall
        kind: positional
        effect: {kind: FSMeta, mode: Direct, valueFrom: args}
      - spec: update
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: toolchain
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: target
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: component
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: override
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: default
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: run
        kind: positional
        effect: {kind: CodeExec, mode: Direct, valueFrom: args}
      - spec: which
        kind: positional
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: show
        kind: positional
        effect: {kind: Stdio, mode: Direct, valueFrom: args}
      - spec: doc
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: "-v"
        kind: flag
        effect: {kind: Stdio, mode: Direct, valueFrom: args}
      - spec: "--verbose"
        kind: flag
        effect: {kind: Stdio, mode: Direct, valueFrom: args}
      - spec: "--version"
        kind: flag
        effect: {kind: Stdio, mode: Direct, valueFrom: args}
      - spec: "--help"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}

