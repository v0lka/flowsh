version: effect-kb/v2
# ---------------------------------------------------------------------------
# Language runtimes and their ecosystem tooling: Node (node/npx/bun), Python
# (python/uv/poetry), Ruby (ruby/bundle), Java (java/mvn/gradle), .NET
# (dotnet), PHP (php/composer) and Elixir (elixir/mix), plus the extended
# toolchains documented below — Go, the wider Node.js bundler/framework/
# task-runner surface, Python env/checker tooling, the JVM (Scala/Kotlin/JDK)
# toolchain and Rust/Zig.
#
# Sources: node(1)/npx(1)/bun(1), python(1)/uv(1)/poetry(1), ruby(1)/bundle(1),
# java(1)/mvn(1)/gradle(1), dotnet(1), php(1)/composer(1) and elixir(1)/mix(1).
# The distribution package managers (apt, rpm, …) and the already-documented
# language package managers (pip, npm, yarn, pnpm, gem, cargo, go, rustc) live
# in pkgmgr.yaml; this document carries the runtimes and their remaining
# ecosystem tooling.  Every entry is documented against the `pkgmgr` dialect
# (the language-ecosystem tradition already used by cargo/rustc/go/npm/gem).
#
# Modelling.  A runtime that executes a program (node script.js, python -c …,
# java -jar …, npx somebin) contributes CodeExec; a package/dependency
# operation that writes a local store or manifest is FSWrite; one that reaches
# a registry is NetEgress; a toolchain that spawns a child compiler/runner is
# ProcSpawn; read-only inspection is FSRead; and version/help output is Stdio.
#
# Script runners (node, python, ruby, java, php, elixir) and the package
# runners (npx, bun) take a single generic operand — the script/class/binary
# that is executed — rather than a subcommand list, because their first operand
# may name an arbitrary file.  The subcommand-first CLIs (uv, poetry, bundle,
# dotnet, composer, mix) declare their subcommands as positional operands; the
# generic build drivers (mvn, gradle) take an arbitrary goal/task, so they use
# a single generic operand to avoid mis-binding an unknown goal.
# ---------------------------------------------------------------------------
commands:
  - name: node
    dialect: pkgmgr
    params:
      - spec: SCRIPT
        kind: positional
        effect: {kind: CodeExec, mode: Direct, valueFrom: args}
      - spec: "-e"
        kind: option
        effect: {kind: CodeExec, mode: Direct, valueFrom: flagValue}
      - spec: "--eval"
        kind: option
        effect: {kind: CodeExec, mode: Direct, valueFrom: flagValue}
      - spec: "-p"
        kind: option
        effect: {kind: CodeExec, mode: Direct, valueFrom: flagValue}
      - spec: "--print"
        kind: option
        effect: {kind: CodeExec, mode: Direct, valueFrom: flagValue}
      - spec: "-r"
        kind: option
        effect: {kind: CodeExec, mode: Direct, valueFrom: flagValue}
      - spec: "--require"
        kind: option
        effect: {kind: CodeExec, mode: Direct, valueFrom: flagValue}
      - spec: "-c"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "--check"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "--env-file"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "--inspect"
        kind: flag
        effect: {kind: NetIngress, mode: Direct, valueFrom: args}
      - spec: "--inspect-brk"
        kind: flag
        effect: {kind: NetIngress, mode: Direct, valueFrom: args}
      - spec: "--input-type"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "-v"
        kind: flag
        effect: {kind: Stdio, mode: Direct, valueFrom: args}
      - spec: "--version"
        kind: flag
        effect: {kind: Stdio, mode: Direct, valueFrom: args}
      - spec: "--help"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}

  # NOTE: `npx` is deliberately NOT modelled here — and does not need to be.
  # A package runner (`npx <bin>`) executes its first non-flag operand, so the
  # BINDER resolves the runner (and any path-qualified spelling whose basename
  # is a modelled binary — the ./node_modules/.bin/<bin> bin-dir seam and the
  # project-local wrapper script ./mvnw, bind/resolve.go step 4a) onto the
  # operand's own knowledge-base command:
  # `npx vitest run` binds vitest's signature, `npx tsc -b` binds tsc's, and
  # both retry-pair spellings carry one canonical identity
  # (internal/analysis/canonical_test.go
  # TestCanonicalNpxTscVsLocalBinaryIsNotSplit). The fail-closed shapes stay ⊤:
  # an operand outside the knowledge base (a registry fetch whose code the
  # analysis cannot see), a dynamic operand, a runner that names no operand,
  # -c/--call (an arbitrary shell string), and a code-execution interpreter
  # operand (npx node -e … — ⊤ like the bare node -e …, matching the
  # frontend's own sink rule). A KB signature for `npx` itself
  # would UNDER-approximate — bounding `npx <unmodelled-pkg>` as a known
  # quantity — which is exactly what the binder-level resolution avoids.
  # The conditional registry fetch is deliberately not modelled, matching the
  # npm run/exec and bun entries: the executed binary's signature is the bound
  # surface. Accepted precision/recall trade-off: the path rule is the general
  # basename one, so a path whose basename names a modelled binary (e.g.
  # /opt/tools/tsc) binds to that binary's signature rather than degrading to
  # ⊤ — the same trust PATH already grants the bare name.

  - name: bun
    dialect: pkgmgr
    params:
      - spec: COMMAND
        kind: positional
        effect: {kind: CodeExec, mode: Direct, valueFrom: args}
      - spec: "-g"
        kind: flag
        effect: {kind: PrivEsc, mode: Conditional, valueFrom: args}
      - spec: "--global"
        kind: flag
        effect: {kind: PrivEsc, mode: Conditional, valueFrom: args}
      - spec: "--cwd"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "--registry"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "--frozen-lockfile"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "--production"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "--no-save"
        kind: flag
        effect: {kind: FSMeta, mode: Direct, valueFrom: args}
      - spec: "-v"
        kind: flag
        effect: {kind: Stdio, mode: Direct, valueFrom: args}
      - spec: "--version"
        kind: flag
        effect: {kind: Stdio, mode: Direct, valueFrom: args}

