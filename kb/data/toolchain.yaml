  # --- JVM ecosystem tooling ------------------------------------------------
  # The Java/Scala/Kotlin toolchain: the Java compiler and its companions
  # (javac, javadoc, jar, jshell, keytool), the Scala toolchain (scala, scalac,
  # sbt, scala-cli, mill), the Kotlin toolchain (kotlin, kotlinc, kotlinc-jvm,
  # kscript), the JVM build/tool managers (ant, jbang, coursier, mvnd — the
  # Maven daemon) and the scripts on the JVM (groovy, clojure, lein).  A
  # compiler reads sources (FSRead) and writes classes/output (FSWrite); a
  # script/interpreter runner executes its operand (CodeExec); a build driver
  # spawns the toolchain (ProcSpawn) or runs targets (CodeExec); a
  # toolchain/dependency manager writes a local store (FSWrite) or reaches a
  # registry (NetEgress); read-only inspection is FSRead; version/help is
  # Stdio/FSRead.
  - name: javac
    dialect: pkgmgr
    params:
      - spec: SRC
        kind: positional
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-d"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "-h"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "-cp"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "-classpath"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "--class-path"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "-sourcepath"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "--source-path"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "-processorpath"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "-processor"
        kind: option
        effect: {kind: CodeExec, mode: Direct, valueFrom: flagValue}
      - spec: "-encoding"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "-release"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "-source"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "-target"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "-g"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-nowarn"
        kind: flag
        effect: {kind: Stdio, mode: Direct, valueFrom: args}
      - spec: "-verbose"
        kind: flag
        effect: {kind: Stdio, mode: Direct, valueFrom: args}
      - spec: "-version"
        kind: flag
        effect: {kind: Stdio, mode: Direct, valueFrom: args}
      - spec: "--version"
        kind: flag
        effect: {kind: Stdio, mode: Direct, valueFrom: args}
      - spec: "-help"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "--help"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}

