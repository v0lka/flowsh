  # --- Zig ecosystem tooling -----------------------------------------------
  # The Zig compiler/build system/package manager (zig) and its language server
  # (zls).  A build/test driver spawns the toolchain (ProcSpawn); an explicit
  # compile writes an artifact (FSWrite); a run executes produced code
  # (CodeExec); the in-place formatter is FSWrite; the package fetch reaches the
  # network (NetEgress); env/version/help is EnvRead/Stdio/FSRead.
  - name: zig
    dialect: pkgmgr
    params:
      - spec: build
        kind: positional
        effect: {kind: ProcSpawn, mode: Direct, valueFrom: args}
      - spec: build-exe
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: build-lib
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: build-obj
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: test
        kind: positional
        effect: {kind: ProcSpawn, mode: Direct, valueFrom: args}
      - spec: run
        kind: positional
        effect: {kind: CodeExec, mode: Direct, valueFrom: args}
      - spec: fmt
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: fetch
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: init
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: ast-check
        kind: positional
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: cc
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: c++
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: env
        kind: positional
        effect: {kind: EnvRead, mode: Direct, valueFrom: args}
      - spec: version
        kind: positional
        effect: {kind: Stdio, mode: Direct, valueFrom: args}
      - spec: "-o"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "--prefix"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "--pkg-dir"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "--release"
        kind: flag
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: "--help"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}

