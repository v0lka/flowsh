version: effect-kb/v2
# ---------------------------------------------------------------------------
# Language runtimes and their ecosystem tooling: Node (node/npx/bun), Python
# (python/uv/poetry), Ruby (ruby/bundle), Java (java/mvn/gradle), .NET
# (dotnet), PHP (php/composer) and Elixir (elixir/mix).
#
# Sources: node(1)/npx(1)/bun(1), python(1)/uv(1)/poetry(1), ruby(1)/bundle(1),
# java(1)/mvn(1)/gradle(1), dotnet(1), php(1)/composer(1) and elixir(1)/mix(1).
# The distribution package managers (apt, rpm, …) and the already-documented
# language package managers (pip, npm, yarn, pnpm, gem, cargo, go, rustc) live
# in pkgmgr.yaml; this document carries the runtimes and their remaining
# ecosystem tooling.  Every entry is documented against the `pkgmgr` dialect
# (the language-ecosystem tradition already used by cargo/rustc/go/npm/gem).
#
# Modelling.  A runtime that executes a program (node script.js, python -c …,
# java -jar …, npx somebin) contributes CodeExec; a package/dependency
# operation that writes a local store or manifest is FSWrite; one that reaches
# a registry is NetEgress; a toolchain that spawns a child compiler/runner is
# ProcSpawn; read-only inspection is FSRead; and version/help output is Stdio.
#
# Script runners (node, python, ruby, java, php, elixir) and the package
# runners (npx, bun) take a single generic operand — the script/class/binary
# that is executed — rather than a subcommand list, because their first operand
# may name an arbitrary file.  The subcommand-first CLIs (uv, poetry, bundle,
# dotnet, composer, mix) declare their subcommands as positional operands; the
# generic build drivers (mvn, gradle) take an arbitrary goal/task, so they use
# a single generic operand to avoid mis-binding an unknown goal.
# ---------------------------------------------------------------------------
commands:
  - name: node
    dialect: pkgmgr
    params:
      - spec: SCRIPT
        kind: positional
        effect: {kind: CodeExec, mode: Direct, valueFrom: args}
      - spec: "-e"
        kind: option
        effect: {kind: CodeExec, mode: Direct, valueFrom: flagValue}
      - spec: "--eval"
        kind: option
        effect: {kind: CodeExec, mode: Direct, valueFrom: flagValue}
      - spec: "-p"
        kind: option
        effect: {kind: CodeExec, mode: Direct, valueFrom: flagValue}
      - spec: "--print"
        kind: option
        effect: {kind: CodeExec, mode: Direct, valueFrom: flagValue}
      - spec: "-r"
        kind: option
        effect: {kind: CodeExec, mode: Direct, valueFrom: flagValue}
      - spec: "--require"
        kind: option
        effect: {kind: CodeExec, mode: Direct, valueFrom: flagValue}
      - spec: "-c"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "--check"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "--env-file"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "--inspect"
        kind: flag
        effect: {kind: NetIngress, mode: Direct, valueFrom: args}
      - spec: "--inspect-brk"
        kind: flag
        effect: {kind: NetIngress, mode: Direct, valueFrom: args}
      - spec: "--input-type"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "-v"
        kind: flag
        effect: {kind: Stdio, mode: Direct, valueFrom: args}
      - spec: "--version"
        kind: flag
        effect: {kind: Stdio, mode: Direct, valueFrom: args}
      - spec: "--help"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}

  # NOTE: `npx` is deliberately NOT modelled here.  Its invocation form
  # (`npx <bin>`) makes it a package runner, and
  # internal/analysis/canonical_test.go TestCanonicalNpxTscVsLocalBinaryIsNotSplit
  # pins that `npx tsc -b` and the equivalent `./node_modules/.bin/tsc -b` carry
  # the same canonical key today precisely because BOTH resolve to ⊤ (the path
  # form has no KB command).  Giving `npx` a KB signature makes the runner form
  # bounded while the path form stays ⊤, which splits that pinned retry pair.
  # `npx` therefore stays unmodelled until the binder can resolve a
  # node_modules/.bin path to its bare binary.

  - name: bun
    dialect: pkgmgr
    params:
      - spec: COMMAND
        kind: positional
        effect: {kind: CodeExec, mode: Direct, valueFrom: args}
      - spec: "-g"
        kind: flag
        effect: {kind: PrivEsc, mode: Conditional, valueFrom: args}
      - spec: "--global"
        kind: flag
        effect: {kind: PrivEsc, mode: Conditional, valueFrom: args}
      - spec: "--cwd"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "--registry"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "--frozen-lockfile"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "--production"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "--no-save"
        kind: flag
        effect: {kind: FSMeta, mode: Direct, valueFrom: args}
      - spec: "-v"
        kind: flag
        effect: {kind: Stdio, mode: Direct, valueFrom: args}
