  # --- Node.js ecosystem tooling -------------------------------------------
  # Package-manager shims (corepack), alternative runtimes (deno), TypeScript
  # runners and watchers (tsx, ts-node, nodemon), bundlers/build drivers
  # (vite, webpack, rollup, esbuild, swc, parcel), framework CLIs (next, nuxt,
  # react-scripts), monorepo task runners (turbo, nx, lerna), task runners
  # (gulp, grunt), the process manager (pm2) and the native build tool
  # (node-gyp).  A runner/runtime contributes CodeExec; a package operation
  # writes a store (FSWrite) or reaches a registry (NetEgress); a build/test
  # driver spawns child processes (ProcSpawn); a dev/preview server listens
  # (NetIngress); read-only inspection is FSRead; version/help is Stdio/FSRead.
  - name: corepack
    dialect: pkgmgr
    params:
      - spec: COMMAND
        kind: positional
        effect: {kind: CodeExec, mode: Direct, valueFrom: args}
      - spec: enable
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: disable
        kind: positional
        effect: {kind: FSMeta, mode: Direct, valueFrom: args}
      - spec: prepare
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: install
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: use
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: "--version"
        kind: flag
        effect: {kind: Stdio, mode: Direct, valueFrom: args}
      - spec: "--help"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}

