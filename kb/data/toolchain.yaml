  # --- Go ecosystem tooling -------------------------------------------------
  # The language server, debugger, release driver and code generators.  A tool
  # that runs a program/analysis server (the language server, the debugger)
  # contributes CodeExec; a generator that writes files is FSWrite; a
  # release/publish step reaches a registry (NetEgress — the pkgmgr dialect is
  # the strict egress tier); read-only inspection is FSRead; version/help output
  # is Stdio/FSRead.  Every entry either declares an operand or carries a
  # `self` parameter, so a bare invocation still yields a bounded, non-⊤ report.
  - name: gopls
    dialect: pkgmgr
    params:
      - spec: COMMAND
        kind: positional
        effect: {kind: CodeExec, mode: Direct, valueFrom: args}
      - spec: "-w"
        kind: flag
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: "--write"
        kind: flag
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: "-v"
        kind: flag
        effect: {kind: Stdio, mode: Direct, valueFrom: args}
      - spec: "--version"
        kind: flag
        effect: {kind: Stdio, mode: Direct, valueFrom: args}
      - spec: "--help"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}

