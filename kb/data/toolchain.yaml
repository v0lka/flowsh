  # --- Python ecosystem tooling --------------------------------------------
  # The uv tool runner (uvx), the environment/dependency managers (pipenv, pdm,
  # hatch, conda, mamba), the test-env tools (tox, nox), the virtualenv layer
  # (virtualenv, pipx), the interactive interpreter and notebook front ends
  # (ipython, jupyter) and the packaging tools (twine, pyinstaller).  A
  # dependency operation writes a local store (FSWrite) or reaches a registry
  # (NetEgress); a runner contributes CodeExec; a build/test driver is
  # ProcSpawn; a notebook/server front end listens (NetIngress); read-only
  # inspection is FSRead; version/help is Stdio/FSRead.
  - name: uvx
    dialect: pkgmgr
    params:
      - spec: COMMAND
        kind: positional
        effect: {kind: CodeExec, mode: Direct, valueFrom: args}
      - spec: "--from"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "--with"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "--python"
        kind: option
        effect: {kind: ProcSpawn, mode: Direct, valueFrom: flagValue}
      - spec: "--version"
        kind: flag
        effect: {kind: Stdio, mode: Direct, valueFrom: args}
      - spec: "--help"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}

