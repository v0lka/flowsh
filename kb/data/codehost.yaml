        effect: {kind: NetEgress, mode: Direct, valueFrom: env}
      - spec: variable
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: env}
      - spec: label
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: env}
      - spec: milestone
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: env}
      - spec: incident
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: env}
      - spec: todo
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: env}
      - spec: schedule
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: env}
      - spec: auth
        kind: positional
        effect: {kind: CredAccess, mode: Direct, valueFrom: args}
      - spec: ssh-key
        kind: positional
        effect: {kind: CredAccess, mode: Direct, valueFrom: args}
      - spec: gpg-key
        kind: positional
        effect: {kind: CredAccess, mode: Direct, valueFrom: args}
      - spec: config
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: help
        kind: positional
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: completion
        kind: positional
        effect: {kind: Stdio, mode: Direct, valueFrom: args}
      - spec: version
        kind: positional
        effect: {kind: Stdio, mode: Direct, valueFrom: args}
      - spec: "-R"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "--repo"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "--hostname"
        kind: option
