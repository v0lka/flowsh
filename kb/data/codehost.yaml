version: effect-kb/v2
# ---------------------------------------------------------------------------
# Code-host and modern version-control command-line clients: the GitHub CLI
# (gh), the GitLab CLI (glab) and Jujutsu (jj).
#
# Sources: gh(1) and the GitHub CLI manual, glab(1) and the GitLab CLI docs,
# and jj(1) and the Jujutsu manual.  `git` is documented in remote.yaml and
# `hg` in vcs.yaml; this document carries the remaining code-host and
# next-generation version-control clients.
#
# Every entry is documented against the `vcs` dialect (the same tradition as
# svn/hg/bzr/fossil/darcs), so the binder applies its strict egress-target
# grammar: a bare subcommand word can never fabricate a network destination.
#
# Modelling.  These clients are remote-first, so a subcommand that talks to
# the code host is NetEgress.  Subcommands that only render local output are
# FSRead; those that carry an identity or a secret (auth, ssh-key, secret) are
# CredAccess; local configuration and extension management is FSWrite/FSMeta;
# and a subcommand that runs another program (gh run, jj git) is
# ProcSpawn/CodeExec.  Subcommands are modelled as positional operands: the
# binder matches the leading operand by value and consumes the rest of the
# operands as that subcommand's operand group.
# ---------------------------------------------------------------------------
commands:
  - name: gh
    dialect: vcs
    params:
      # Remote subcommands (NetEgress; the strict vcs egress gate keeps a
      # non-address operand from becoming a fabricated destination).
      - spec: api
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: pr
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: issue
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: run
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: repo
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: release
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: gist
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: search
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: browse
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: status
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: codespace
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: label
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: project
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: variable
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: workflow
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: org
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: ruleset
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: attestation
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      # Credential-bearing subcommands.
      - spec: auth
        kind: positional
        effect: {kind: CredAccess, mode: Direct, valueFrom: args}
      - spec: secret
        kind: positional
        effect: {kind: CredAccess, mode: Direct, valueFrom: args}
      - spec: ssh-key
        kind: positional
        effect: {kind: CredAccess, mode: Direct, valueFrom: args}
      - spec: gpg-key
        kind: positional
        effect: {kind: CredAccess, mode: Direct, valueFrom: args}
      # Local state.
      - spec: config
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: alias
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: extension
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: cache
        kind: positional
        effect: {kind: FSMeta, mode: Direct, valueFrom: args}
      - spec: help
        kind: positional
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: completion
        kind: positional
        effect: {kind: Stdio, mode: Direct, valueFrom: args}
      - spec: version
        kind: positional
        effect: {kind: Stdio, mode: Direct, valueFrom: args}
      # Flags that name a remote destination, a credential or an output shape.
      - spec: "-R"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "--repo"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "--hostname"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "--token"
        kind: option
        effect: {kind: CredAccess, mode: Direct, valueFrom: flagValue}
      - spec: "--json"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "-q"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "--jq"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "-t"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "--template"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}

