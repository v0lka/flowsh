  - name: jj
    dialect: vcs
    params:
      # Remote operations.
      - spec: clone
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: fetch
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: env}
      - spec: push
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: env}
      - spec: pull
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: env}
      - spec: git
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: env}
      # Working-copy and history rewrites.
      - spec: commit
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: describe
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: new
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: edit
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: squash
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: rebase
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: abandon
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: restore
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: revert
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: resolve
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: undo
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: init
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: duplicate
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: split
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: move
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: absorb
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: fix
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: sign
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      # Repository/workspace metadata.
      - spec: bookmark
        kind: positional
        effect: {kind: FSMeta, mode: Direct, valueFrom: args}
      - spec: branch
        kind: positional
        effect: {kind: FSMeta, mode: Direct, valueFrom: args}
      - spec: tag
        kind: positional
        effect: {kind: FSMeta, mode: Direct, valueFrom: args}
      - spec: op
        kind: positional
        effect: {kind: FSMeta, mode: Direct, valueFrom: args}
      - spec: config
        kind: positional
        effect: {kind: FSMeta, mode: Direct, valueFrom: args}
      - spec: sparse
        kind: positional
        effect: {kind: FSMeta, mode: Direct, valueFrom: args}
      - spec: workspace
        kind: positional
        effect: {kind: FSMeta, mode: Direct, valueFrom: args}
      - spec: util
        kind: positional
        effect: {kind: FSMeta, mode: Direct, valueFrom: args}
      # Read-only inspection.
      - spec: log
        kind: positional
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: status
        kind: positional
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: diff
        kind: positional
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: show
        kind: positional
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: file
        kind: positional
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: debug
        kind: positional
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      # Flags.
      - spec: "-R"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "--repository"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "-r"
        kind: option
        effect: {kind: Stdio, mode: Direct, valueFrom: flagValue}
      - spec: "--revisions"
        kind: option
        effect: {kind: Stdio, mode: Direct, valueFrom: flagValue}
      - spec: "-T"
