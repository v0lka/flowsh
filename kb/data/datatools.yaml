version: effect-kb/v2
# ---------------------------------------------------------------------------
# Data and query command-line tools: the JSON/YAML processors (jq, yq), the
# database clients (sqlite3, psql, redis-cli) and the fast search tools
# (ripgrep `rg`, `fd`, the_silver_searcher `ag`).
#
# Sources: jq(1), yq(1), sqlite3(1), psql(1), redis-cli(1), rg(1), fd(1) and
# ag(1).  The dialect is chosen per tradition: jq/yq/sqlite3 are local
# text/data filters (the GNU filter tradition, `gnu`); psql and redis-cli are
# network database clients (`net-tools`, whose lenient egress grammar accepts a
# bare host); and rg/fd/ag are grep/find replacements (`findutils`, the GNU
# findutils tradition).
#
# Modelling.  A tool that reads its operands is FSRead; one that rewrites them
# in place (yq -i) is FSWrite; one that runs a subcommand over its results
# (rg --pre, fd -x, redis-cli --eval, sqlite3 -cmd) is CodeExec/ProcSpawn; a
# database client that connects to a server is NetEgress; and rendered output
# is Stdio.
# ---------------------------------------------------------------------------
commands:
  - name: jq
    dialect: gnu
    params:
      - spec: FILTER
        kind: positional
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: FILE
