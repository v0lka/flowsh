version: effect-kb/v2
# ---------------------------------------------------------------------------
# GNU coreutils, extended set (roadmap task B2).
#
# Sources: the GNU coreutils manual (info coreutils) and manual verification
# against a running GNU/Linux system. This document completes the GNU coreutils
# coverage that coreutils.yaml (POSIX utilities plus a few GNU-only ones) and
# findutils.yaml (xargs) start: the informational utilities, the checksum and
# encoding tools, the text-processing filters and the filesystem utilities that
# were not yet declared. Every entry is documented against the `gnu` dialect.
#
# Wrapper note: `env`, `nice`, `nohup` and `timeout` are recognised as command
# wrappers by the bash frontend (front/bash/normalize.go), which peels them off
# before name resolution; `xargs` is a wrapper too and already lives in
# findutils.yaml. They are still declared here because the knowledge base is
# frontend-agnostic: a frontend that does not peel wrappers, or a call
# constructed directly through bind.Bind, must still see their effects. There is
# no double counting: the bash frontend removes the wrapper before the KB is
# consulted, so at most one of the two paths contributes for any given call.
# ---------------------------------------------------------------------------
commands:
  # --- informational / system ------------------------------------------------
  - name: arch
    dialect: gnu
    params:
      - spec: "--help"
        kind: flag
        effect: {kind: Stdio, mode: Direct, valueFrom: args}
