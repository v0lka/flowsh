version: effect-kb/v2
# ---------------------------------------------------------------------------
# rsync and git.
#
# Sources: the rsync manual (--delete, --remove-source-files, -a, -e,
# --rsync-path, --dry-run) and the git manual (clone/fetch/pull/push,
# checkout/reset/clean/rm, config/remote add, -C/--git-dir/--work-tree,
# --hard, --force/-f, clean -xfd). Subcommands are modelled as positional
# operands; clean's -x/-f/-d are the flags that widen its deletion.
# ---------------------------------------------------------------------------
commands:
  - name: rsync
    dialect: rsync
    params:
      - spec: "--delete"
        kind: flag
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: "--delete-before"
        kind: flag
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: "--remove-source-files"
        kind: flag
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: "-a"
        kind: flag
        effect: {kind: FSMeta, mode: Direct, valueFrom: args}
      - spec: "-r"
        kind: flag
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: "-x"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "--exclude"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "--include"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "-e"
        kind: option
        effect: {kind: ProcSpawn, mode: Direct, valueFrom: flagValue}
      - spec: "--rsync-path"
        kind: option
        effect: {kind: ProcSpawn, mode: Direct, valueFrom: flagValue}
      - spec: "-P"
        kind: flag
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: "--partial"
        kind: flag
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: "-n"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "--dry-run"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: SRC
        kind: positional
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: DEST
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}

  - name: git
    dialect: git
    params:
      - spec: "-C"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "-c"
        kind: option
        effect: {kind: EnvWrite, mode: Direct, valueFrom: flagValue}
      - spec: "--git-dir"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "--work-tree"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "--hard"
        kind: flag
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: "--force"
        kind: flag
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: clone
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: fetch
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: pull
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: push
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: checkout
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: reset
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: clean
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: config
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: remote
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: gc
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: credential
        kind: positional
        effect: {kind: CredAccess, mode: Direct, valueFrom: args}
      - spec: rm
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: add
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: "-f"
        kind: flag
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: "-x"
        kind: flag
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: "-d"
        kind: flag
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
