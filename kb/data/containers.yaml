version: effect-kb/v2
# ---------------------------------------------------------------------------
# Container, orchestration and infrastructure tooling: Docker (docker,
# docker-compose), Kubernetes (kubectl), Helm, Terraform and Ansible.
#
# Sources: docker(1) and docker-compose(1), kubectl(1), helm(1), terraform(1)
# and ansible(1)/ansible-playbook(1)/ansible-vault(1)/ansible-galaxy(1).
#
# Every entry is documented against the `systemd` dialect (the
# services-and-system-control tradition: these clients start, stop and
# reconfigure long-running workloads, and the lenient egress grammar of that
# dialect accepts the deliberately short host names a cluster context uses).
#
# Modelling.  A subcommand that drives a workload or runs its code is
# CodeExec/ProcSpawn; one that stops or signals it is ProcSignal; one that
# talks to a registry or cluster API is NetEgress; local manifest/config state
# is FSWrite/FSMeta; read-only inspection is FSRead; a locally served proxy or
# forwarded port is NetIngress; and an identity or key is CredAccess.
#
# The Ansible entry points are modelled per binary: `ansible` and
# `ansible-playbook` take a host pattern / playbook as their operand (so they
# use a single generic positional), while `ansible-vault`, `ansible-galaxy`,
# `ansible-inventory`, `ansible-doc` and `ansible-config` are subcommand-first.
#
# A workload/service selector carries `valueFrom: env`, not `valueFrom: args`.
# `kubectl get pods`, `helm list`, `terraform init` name the operation and its
# object — a verb, a resource kind, a release or a module — and the exchange
# goes to the cluster, registry or module source the client is configured for
# (KUBECONFIG, DOCKER_HOST, the terraform backend, the Galaxy server), not to
# an address written on the command line.  Reading the operand group as the
# target made the lenient grammar accept the operation word itself as a
# destination (`kubectl get pods` → `NetEgress {"pods"}` — the phantom-egress
# class the host-shape gate exists to prevent).  The effect is kept, with the
# unresolved (⊤) target the configured endpoint deserves; an address written on
# the command line (`kubectl -s/--server URL`) still lowers to its concrete
# host.  `ansible`'s PATTERN is deliberately left on `args`: it names the host
# pattern the play runs on and is modelled CodeExec, so it is not an egress
# selector and this change does not touch it.
#
# Parameters that select *which* object or *how* the result is rendered
# (`kubectl -n/--namespace, -o/--output, -l/--selector, --context, --cluster`,
# `helm -n/--namespace, -o/--output, --version`, `terraform -target`,
# `docker --platform`, `docker-compose -p/--project-name, --profile`,
# `ansible`/`ansible-playbook -l/--limit, -t/--tags, --skip-tags`,
# `ansible-doc -t/--type`) are Stdio, not FSRead: they name no file, so an
# FSRead of their value was a fabricated file read.  Parameters that do name a
# path (`-f/--filename`, `--values`, `--kubeconfig`, `--inventory`, `-chdir`)
# stay FSRead.
# ---------------------------------------------------------------------------
