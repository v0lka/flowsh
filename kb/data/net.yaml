  - name: ip
    dialect: net-tools
    params:
      # Finding 18: `ip` is a local-network-stack tool. The object words
      # (addr/link/route/rule/neigh/tunnel) select what is inspected and are
      # reads — `ip route` alone means `ip route show`. The verbs add/del/set
      # rewrite kernel state that outlives the invocation (a route, an address,
      # a link flag), which is Persist, not NetIngress: nothing here receives
      # inbound traffic.
      #
      # Residual: the binder binds a positional by VALUE only when it is the
      # FIRST operand (bind/bind.go's leading-operand match — the rule that
      # models `nft add`, `git clone`, `systemctl start`), so in the two-word
      # spelling `ip route add …` only the object word binds and the verb never
      # does: the mutation reaches Persist for `ip add …`/`ip route`-less
      # orderings, while `ip route add …` still reports the object's read. The
      # alternative — declaring the object words Persist — would report every
      # `ip addr`/`ip link`/`ip route` listing as a host-state change, which is
      # the over-report the finding's negative controls exist to forbid. Closing
      # the residual needs a verb slot in the binder (a second positional
      # matched after the object), i.e. a bind/bind.go change, not a KB one.
      - spec: addr
        kind: positional
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: address
        kind: positional
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: link
        kind: positional
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: route
        kind: positional
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: rule
        kind: positional
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: neigh
        kind: positional
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: tunnel
        kind: positional
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: add
        kind: positional
        effect: {kind: Persist, mode: Direct, valueFrom: args}
      - spec: del
        kind: positional
        effect: {kind: Persist, mode: Direct, valueFrom: args}
      - spec: set
        kind: positional
        effect: {kind: Persist, mode: Direct, valueFrom: args}
      # The remaining mutation verbs `ip` documents for its objects
      # (`ip route flush`, `ip addr change|replace`, `ip link delete`). They are
      # declared Persist for the same reason as add/del/set: they rewrite
      # kernel state that outlives the invocation.
      - spec: delete
        kind: positional
        effect: {kind: Persist, mode: Direct, valueFrom: args}
      - spec: flush
        kind: positional
        effect: {kind: Persist, mode: Direct, valueFrom: args}
      - spec: change
        kind: positional
        effect: {kind: Persist, mode: Direct, valueFrom: args}
      - spec: replace
        kind: positional
        effect: {kind: Persist, mode: Direct, valueFrom: args}
      - spec: show
        kind: positional
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-4"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-6"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-s"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-o"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-br"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-f"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "-n"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}

  - name: iptables
    dialect: net-tools
    params:
      # Finding 18: netfilter rows mutate local kernel state — they never
      # receive inbound traffic. Rule, chain, policy and counter changes are
      # Persist (they outlive the invocation and survive until reboot or until
      # a flush); the rule components (-j/-p/-s/-d/--dport/--sport) are the
      # parts of that same mutation. Only the inspection spellings (-L/-S/-n/
      # -v/--save) are reads, and -t stays a table selector (FSMeta) so a
      # listing with an explicit table is not reported as a write.
      - spec: "-A"
