    params:
      # Finding 18: nft edits the in-kernel packet filter. `list` inspects it
      # (a read); add/insert/delete/flush and a ruleset file (-f) rewrite it,
      # which is a persistent host-state change, not inbound traffic.
      - spec: list
        kind: positional
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: add
        kind: positional
        effect: {kind: Persist, mode: Direct, valueFrom: args}
      - spec: insert
        kind: positional
        effect: {kind: Persist, mode: Direct, valueFrom: args}
      - spec: delete
        kind: positional
        effect: {kind: Persist, mode: Direct, valueFrom: args}
      - spec: flush
        kind: positional
        effect: {kind: Persist, mode: Direct, valueFrom: args}
      - spec: "-f"
        kind: option
        effect: {kind: Persist, mode: Direct, valueFrom: flagValue}
      - spec: "-j"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-n"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-a"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-e"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}

  - name: ufw
