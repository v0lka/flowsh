version: effect-kb/v2
# ---------------------------------------------------------------------------
# Network, remote-access and security-tooling commands: net-tools, curl, wget,
# nc, openssh, plus DNS, reachability, capture/scan, firewall, SMB/LDAP and
# cloud-sync utilities.
#
# Sources: the net-tools man pages (ifconfig, route, netstat, arp), the curl
# and wget manuals, the nc(1) and ssh(1)/scp(1) manuals, and the manuals of the
# DNS, reachability, capture/scan, firewall and file-sharing tools.
# Credential-bearing flags are tagged CredAccess; anything that opens a
# listening socket or a forwarded port is NetIngress; outbound requests are
# NetEgress; flags that write a local file are FSWrite; a remote command is
# CodeExec; a local socket or agent endpoint is IPC.
# ---------------------------------------------------------------------------
commands:
  - name: ifconfig
    dialect: net-tools
    params:
      - spec: "-a"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-s"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-v"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: IFACE
        kind: positional
        effect: {kind: FSMeta, mode: Direct, valueFrom: args}

  - name: route
    dialect: net-tools
    params:
      - spec: "-n"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-A"
        kind: option
        effect: {kind: NetIngress, mode: Direct, valueFrom: flagValue}
      - spec: "-net"
        kind: flag
        effect: {kind: NetIngress, mode: Direct, valueFrom: args}
      - spec: add
        kind: positional
        effect: {kind: NetIngress, mode: Direct, valueFrom: args}
      - spec: del
        kind: positional
        effect: {kind: NetIngress, mode: Direct, valueFrom: args}
      - spec: gw
        kind: positional
        effect: {kind: NetIngress, mode: Direct, valueFrom: args}

  - name: netstat
    dialect: net-tools
    params:
      - spec: "-a"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-n"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-l"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-p"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-t"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-u"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-r"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-i"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}

  - name: arp
    dialect: net-tools
    params:
      - spec: "-a"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-n"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-d"
        kind: option
        effect: {kind: NetIngress, mode: Direct, valueFrom: flagValue}
      - spec: "-s"
        kind: option
        effect: {kind: NetIngress, mode: Direct, valueFrom: flagValue}

  - name: curl
    dialect: curl
    params:
      - spec: "-o"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "-O"
        kind: flag
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: "-X"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "-d"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue, fileRef: true}
      - spec: "--data"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue, fileRef: true}
      - spec: "--data-binary"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue, fileRef: true}
      - spec: "-H"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "-u"
        kind: option
        effect: {kind: CredAccess, mode: Direct, valueFrom: flagValue}
      - spec: "-k"
        kind: flag
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: "-L"
        kind: flag
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: "-T"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "-F"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue, fileRef: true}
      - spec: "--form"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue, fileRef: true}
      - spec: "-A"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "-b"
        kind: option
        effect: {kind: CredAccess, mode: Direct, valueFrom: flagValue}
      - spec: "-c"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "-K"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "--url"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "-x"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "--proxy"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "--proxy-user"
        kind: option
        effect: {kind: CredAccess, mode: Direct, valueFrom: flagValue}
      - spec: "-e"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "--referer"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "-G"
        kind: flag
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: "--request"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "--header"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "--data-raw"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "--data-urlencode"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue, fileRef: true}
      - spec: "--json"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue, fileRef: true}
      - spec: "--upload-file"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "--cookie"
        kind: option
        effect: {kind: CredAccess, mode: Direct, valueFrom: flagValue}
      - spec: "--cookie-jar"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "--netrc"
        kind: flag
        effect: {kind: CredAccess, mode: Direct, valueFrom: args}
      - spec: "--netrc-file"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "-E"
        kind: option
        effect: {kind: CredAccess, mode: Direct, valueFrom: flagValue}
      - spec: "--cert"
        kind: option
        effect: {kind: CredAccess, mode: Direct, valueFrom: flagValue}
      - spec: "--key"
        kind: option
        effect: {kind: CredAccess, mode: Direct, valueFrom: flagValue}
      - spec: "--cacert"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "--oauth2-bearer"
        kind: option
        effect: {kind: CredAccess, mode: Direct, valueFrom: flagValue}
      - spec: "-D"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "--dump-header"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "--config"
