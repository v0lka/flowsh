  # -------------------------------------------------------------------------
  # DNS lookup tools. A query is an outbound request; a TSIG key or a batch
  # file carries credential material / a local read.
  # -------------------------------------------------------------------------
  - name: dig
    dialect: net-tools
    params:
      - spec: "-t"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "-x"
        kind: flag
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: "-4"
        kind: flag
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: "-6"
        kind: flag
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: "-p"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
