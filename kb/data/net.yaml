  # -------------------------------------------------------------------------
  # Cloud sync (rclone). Reading a remote is FSRead-like, copying between
  # remotes is outbound traffic, and a local log file is a write.
  # -------------------------------------------------------------------------
  - name: rclone
    dialect: rsync
    params:
      - spec: copy
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: sync
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: move
        kind: positional
        effect: {kind: FSMeta, mode: Direct, valueFrom: args}
      - spec: delete
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: purge
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: ls
        kind: positional
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: lsd
        kind: positional
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: cat
        kind: positional
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: md5sum
        kind: positional
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "--dry-run"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-n"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "--config"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "--log-file"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "--files-from"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "--exclude-from"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "--exclude"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "--include"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "--transfers"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "--bwlimit"
        kind: option
        effect: {kind: NetEgress, mode: Direct, valueFrom: flagValue}
      - spec: "-v"
        kind: flag
        effect: {kind: Stdio, mode: Direct, valueFrom: args}
      - spec: SRC
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: DEST
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
