version: effect-kb/v2
# ---------------------------------------------------------------------------
# util-linux: mount/umount, device and privilege tooling.
#
# Sources: the util-linux man pages (mount, umount, wipefs, fdisk, losetup,
# chroot, su, mkfs). Flags that only report state are read-only; flags that
# rewrite device or namespace state are metadata/write effects. `chroot` and
# `su` are privilege-boundary operations.
#
# B3 additions: the read-only inspection utilities `isosize`, `look` and
# `tailf` (FSRead) and the device-configuration helpers `ldattach` and `raw`
# (FSMeta). None of them carries a destructive flag.
# ---------------------------------------------------------------------------
commands:
  - name: mount
    dialect: util-linux
    params:
      - spec: "-o"
        kind: option
        effect: {kind: FSMeta, mode: Direct, valueFrom: flagValue}
      - spec: "-t"
        kind: option
        effect: {kind: FSMeta, mode: Direct, valueFrom: flagValue}
      - spec: "-r"
        kind: flag
        effect: {kind: FSMeta, mode: Direct, valueFrom: args}
      - spec: "-w"
        kind: flag
        effect: {kind: FSMeta, mode: Direct, valueFrom: args}
      - spec: "-a"
        kind: flag
        effect: {kind: FSMeta, mode: Direct, valueFrom: args}
      - spec: "-B"
        kind: flag
        effect: {kind: FSMeta, mode: Direct, valueFrom: args}
      - spec: DEVICE
        kind: positional
        effect: {kind: FSMeta, mode: Direct, valueFrom: args}
      - spec: DIR
        kind: positional
        effect: {kind: FSMeta, mode: Direct, valueFrom: args}

  - name: umount
    dialect: util-linux
    params:
      - spec: "-f"
        kind: flag
        effect: {kind: FSMeta, mode: Direct, valueFrom: args}
      - spec: "-l"
        kind: flag
        effect: {kind: FSMeta, mode: Direct, valueFrom: args}
      - spec: "-a"
