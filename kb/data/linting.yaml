  # golangci-lint is deliberately NOT modelled (the same call as npx in
  # toolchain.yaml). The workspace-scoped verification marker already
  # TOLERATES an unresolved verification driver: its ⊤-on-a-CodeExec-only
  # rule admits the "unknown-driver signature", so a routine `golangci-lint
  # run` inside a verifying command is positively established by the MARKER,
  # not by a bounded effect set — 12 of the 14 silent-audit events that name
  # golangci-lint are TRUE_ALLOW for exactly that reason. Modelling the
  # binary would instead bound EVERY invocation, silently clearing the
  # marker's env/manifest screens on the one audited TRUE_DENY shape that
  # rewrites the module graph (GOFLAGS=-mod=mod plus a `> go.work` write —
  # silent-audit event 966665): a bounded toolchain invocation fires no
  # criterion, so nothing keeps it escalating. Leaving golangci-lint
  # unresolved keeps that shape escalating (non-canonical C6, marker off)
  # while the marker keeps the benign invocations allowed.

