version: effect-kb/v2
# ---------------------------------------------------------------------------
# Front-end build, test and lint drivers: the TypeScript compiler (tsc), the
# JavaScript linters/formatters (eslint, prettier), the JS test runners
# (vitest, jest), the Go tooling (gofmt, staticcheck), the
# Python tooling (ruff, black, mypy), the Rust linter (clippy) and the shell
# linter (shellcheck).
#
# Sources: tsc(1) (the TypeScript compiler), eslint(1), prettier(1), vitest
# and jest docs, golangci-lint(1), gofmt(1), staticcheck(1), ruff(1), black(1),
# mypy(1), clippy/cargo-clippy and shellcheck(1).  The build drivers and
# compilers (make, cmake, ninja, gcc, …) live in build.yaml; this document
# carries the lint/test/format drivers.  Every entry is documented against the
# `build` dialect (the same build-tooling tradition).
#
# Modelling.  A driver that reads sources is FSRead; one that rewrites them in
# place (--fix, --write, gofmt -w, black, ruff format) is FSWrite; a test
# runner or watcher that spawns workers is ProcSpawn; a locally served UI
# (vitest --ui) is NetIngress; rendered output is Stdio.  No command here
# declares NetEgress, so the `build` dialect stays off the network-egress
# inventory.
# ---------------------------------------------------------------------------
commands:
  - name: tsc
    dialect: build
    params:
      - spec: SOURCE
        kind: positional
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "--outDir"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "--outFile"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "-p"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "--project"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "--target"
        kind: option
