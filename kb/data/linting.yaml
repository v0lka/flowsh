  # --- Go ecosystem build/test drivers -------------------------------------
  # Formatters that rewrite sources (goimports -w, gofumpt -w) are FSWrite; the
  # linters/checkers (govulncheck, errcheck, revive, ineffassign, gosec,
  # benchstat) read sources and report (FSRead); a test driver spawns workers
  # (gotestsum, ginkgo run — ProcSpawn); a report file is FSWrite; version/help
  # is Stdio/FSRead.  govulncheck's vulnerability-database fetch is deliberately
  # left UNMODELLED — modelling it would put the `build` dialect on the
  # network-egress inventory, so only the local module/source scan is modelled
  # (the same call the KB makes for markitdown's remote endpoint).
  - name: goimports
    dialect: build
    params:
      - spec: PATH
        kind: positional
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-w"
        kind: flag
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: "-l"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-d"
        kind: flag
        effect: {kind: Stdio, mode: Direct, valueFrom: args}
      - spec: "-e"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-local"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "-v"
        kind: flag
        effect: {kind: Stdio, mode: Direct, valueFrom: args}

  - name: gofumpt
    dialect: build
    params:
      - spec: PATH
        kind: positional
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-w"
        kind: flag
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: "-l"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-d"
        kind: flag
        effect: {kind: Stdio, mode: Direct, valueFrom: args}
      - spec: "-e"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
