  # --- Rust ecosystem build/test drivers -----------------------------------
  # The Rust formatter (rustfmt, also reachable as the cargo subcommand
  # `cargo-fmt`): it rewrites sources in place (FSWrite), reports a diff/check
  # read-only (--check → FSRead), or emits to a file (--emit → FSWrite).  No
  # command here declares NetEgress, so the `build` dialect stays off the
  # network-egress inventory (see kb/loader_test.go TestNetEgressDialectInventory).
  - name: rustfmt
    dialect: build
    aliases:
      - cargo-fmt
    params:
      - spec: SRC
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: "--check"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "--edition"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "--config"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "--config-path"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "--emit"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "--version"
        kind: flag
        effect: {kind: Stdio, mode: Direct, valueFrom: args}
      - spec: "--help"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
