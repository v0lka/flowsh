  # --- Node.js build/test/lint drivers -------------------------------------
  # Test runners spawn workers (mocha, ava, playwright test, cypress run,
  # uvu — ProcSpawn); formatters rewrite sources (biome format, oxlint --fix,
  # rimraf — FSWrite/FSMeta); linters/type checkers read and report (oxlint,
  # tsd — FSRead); a dev/preview/report server listens (playwright open,
  # cypress open, serve — NetIngress); a doc generator writes (typedoc —
  # FSWrite); a task orchestrator executes the wrapped command (concurrently,
  # cross-env — CodeExec).  No command here declares NetEgress, so the `build`
  # dialect stays off the network-egress inventory; playwright/cypress browser
  # downloads are left UNMODELLED (the markitdown precedent).
  - name: mocha
    dialect: build
    params:
      - spec: SPEC
        kind: positional
        effect: {kind: ProcSpawn, mode: Direct, valueFrom: args}
      - spec: "--watch"
        kind: flag
        effect: {kind: ProcSpawn, mode: Direct, valueFrom: args}
      - spec: "--reporter"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "--grep"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "--config"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "--version"
        kind: flag
        effect: {kind: Stdio, mode: Direct, valueFrom: args}
      - spec: "--help"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}

