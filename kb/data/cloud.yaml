version: effect-kb/v2
# ---------------------------------------------------------------------------
# Cloud provider command-line clients: the AWS CLI (aws), the Google Cloud
# CLI (gcloud) and the Azure CLI (az).
#
# Sources: aws(1) / the AWS CLI reference, gcloud(1) / the Google Cloud CLI
# reference and az(1) / the Azure CLI reference.
#
# Every entry is documented against the `net-tools` dialect: these are
# network clients whose first operand names a service, group or resource — a
# bare word that is not a host — so the lenient egress grammar of that dialect
# is the right fit, and a service name never fabricates a dotted destination.
#
# Modelling.  A service/group operation drives a remote control plane, so it
# is NetEgress; credential and identity subcommands (configure, auth, login,
# account) are CredAccess; local client state (config, components, extension)
# is FSWrite; and informational subcommands are FSRead/Stdio.  The first
# operand is always the service or group, so subcommands are modelled as
# positional operands.
# ---------------------------------------------------------------------------
