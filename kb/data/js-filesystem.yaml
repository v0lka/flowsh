version: effect-kb/v4
jsModules:
  - name: fs
    aliases: [node:fs]
    properties:
      promises: fs/promises
      constants: fs.constants
  - name: fs/promises
    aliases: [node:fs/promises]
  # fs.constants is a frozen property namespace, not a requireable module
  # (`fs/constants` is MODULE_NOT_FOUND). Only platform-independent members
  # are listed; O_CREAT-style values differ per platform and stay unknown.
  - name: fs.constants
    internal: true
    constants:
      F_OK: 0
      R_OK: 4
      W_OK: 2
      X_OK: 1
      O_RDONLY: 0
      O_WRONLY: 1
      O_RDWR: 2
      COPYFILE_EXCL: 1
      COPYFILE_FICLONE: 2
      COPYFILE_FICLONE_FORCE: 4
jsCalls:
  - module: fs
    export: readFile
    style: callback
    operation: filesystem
    return: content
    minArgs: 1
    maxArgs: 2
    options: 1
    optionShape: encoding
    optionKeys: [encoding, flag, signal]
    flagOption: flag
    flagDefault: r
    effects:
      - kind: FSRead
        arg: 0
        target: path
  - module: fs
    export: readFileSync
    style: sync
    operation: filesystem
