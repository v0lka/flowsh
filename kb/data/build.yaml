version: effect-kb/v2
# ---------------------------------------------------------------------------
# Build tooling (roadmap task B6): build drivers, compilers/linkers, binary
# inspectors and debuggers.
#
# Sources: the make(1), cmake(1), ninja(1), gcc(1), ld(1), as(1), nm(1),
# objdump(1), readelf(1), strings(1), strip(1), gdb(1), strace(1), ltrace(1),
# valgrind(1), patch(1), diff(1) and cmp(1) manuals. Every entry is documented
# against the `build` dialect.
#
# Note on `ar`: the GNU/BSD archiver is already declared in archive.yaml (it is
# the B5 archive tool set) and is therefore intentionally not repeated here — a
# command name must be unique across the whole knowledge base.
#
# Modelling. A build driver or compiler executes commands and toolchain stages,
# which is CodeExec (recipes run as shell) or ProcSpawn (a child compiler,
# assembler, linker or wrapper); inputs it reads (makefiles, sources, objects,
# scripts, libraries) are FSRead; artefacts it writes (objects, executables,
# dependency files, listings) are FSWrite; in-place rewriting of an existing
# file's symbols is FSMeta; and output streamed to the terminal is Stdio. A
# debugger that attaches to a running process is ProcSignal, and one that runs
# arbitrary commands in the inferior is CodeExec. Subcommand-like goals
# (make install/clean, ninja targets, cmake --build/--install) follow the same
# positional convention used by remote.yaml and vcs.yaml.
# ---------------------------------------------------------------------------
commands:
  # --- Build drivers: make, cmake, ninja -------------------------------------
  - name: make
    dialect: build
    params:
      - spec: "-f"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "-C"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "-j"
        kind: option
        effect: {kind: ProcSpawn, mode: Direct, valueFrom: flagValue}
      - spec: "-n"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "--dry-run"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-B"
        kind: flag
        effect: {kind: ProcSpawn, mode: Direct, valueFrom: args}
      - spec: "-k"
        kind: flag
        effect: {kind: ProcSpawn, mode: Direct, valueFrom: args}
      - spec: TARGET
        kind: positional
        effect: {kind: CodeExec, mode: Direct, valueFrom: args}

  - name: cmake
    dialect: build
    params:
      - spec: "-S"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "-B"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "-D"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "-G"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "-P"
        kind: option
        effect: {kind: CodeExec, mode: Direct, valueFrom: flagValue}
      - spec: "--build"
        kind: option
        effect: {kind: ProcSpawn, mode: Direct, valueFrom: flagValue}
      - spec: "--install"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "--target"
        kind: option
        effect: {kind: ProcSpawn, mode: Direct, valueFrom: flagValue}

  - name: ninja
    dialect: build
    params:
      - spec: "-C"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "-f"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "-j"
        kind: option
        effect: {kind: ProcSpawn, mode: Direct, valueFrom: flagValue}
      - spec: "-t"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "-n"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: TARGET
        kind: positional
        effect: {kind: ProcSpawn, mode: Direct, valueFrom: args}

  # --- Compilers and linkers: gcc/cc/clang, ld, as ---------------------------
  - name: gcc
    dialect: build
    aliases:
      - cc
      - clang
    params:
      - spec: "-o"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "-I"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "-L"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "-l"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "-include"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "-wrapper"
        kind: option
        effect: {kind: ProcSpawn, mode: Direct, valueFrom: flagValue}
      - spec: "-c"
        kind: flag
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: "-S"
        kind: flag
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: "-E"
        kind: flag
        effect: {kind: Stdio, mode: Direct, valueFrom: args}
      - spec: "-save-temps"
        kind: flag
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: SRC
        kind: positional
        effect: {kind: FSRead, mode: Direct, valueFrom: args}

  - name: ld
    dialect: build
    params:
      - spec: "-o"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "-l"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "-L"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "--script"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "-r"
        kind: flag
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: "-shared"
        kind: flag
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: "-s"
        kind: flag
        effect: {kind: FSMeta, mode: Direct, valueFrom: args}
      - spec: "-M"
        kind: flag
        effect: {kind: Stdio, mode: Direct, valueFrom: args}
      - spec: OBJ
        kind: positional
        effect: {kind: FSRead, mode: Direct, valueFrom: args}

  - name: as
    dialect: build
    params:
      - spec: "-o"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "-I"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "-a"
        kind: flag
        effect: {kind: Stdio, mode: Direct, valueFrom: args}
      - spec: SRC
        kind: positional
        effect: {kind: FSRead, mode: Direct, valueFrom: args}

  # --- Binary inspectors: nm, objdump, readelf, strings ----------------------
  - name: nm
    dialect: build
    params:
      - spec: "-C"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-D"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-l"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-S"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-u"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: FILE
        kind: positional
        effect: {kind: FSRead, mode: Direct, valueFrom: args}

  - name: objdump
    dialect: build
    params:
      - spec: "-d"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-D"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-x"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-s"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-h"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-t"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-j"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: FILE
        kind: positional
        effect: {kind: FSRead, mode: Direct, valueFrom: args}

  - name: readelf
    dialect: build
    params:
      - spec: "-a"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-h"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-s"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-d"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-l"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-S"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: FILE
        kind: positional
        effect: {kind: FSRead, mode: Direct, valueFrom: args}

  - name: strings
    dialect: build
    params:
      - spec: "-a"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-f"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-n"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "-t"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: FILE
        kind: positional
        effect: {kind: FSRead, mode: Direct, valueFrom: args}

  - name: strip
    dialect: build
    params:
      - spec: "-o"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "-s"
        kind: flag
        effect: {kind: FSMeta, mode: Direct, valueFrom: args}
      - spec: "-K"
        kind: option
        effect: {kind: FSMeta, mode: Direct, valueFrom: flagValue}
      - spec: "-N"
        kind: option
        effect: {kind: FSMeta, mode: Direct, valueFrom: flagValue}
      - spec: "-g"
        kind: flag
        effect: {kind: FSMeta, mode: Direct, valueFrom: args}
      - spec: "-S"
        kind: flag
        effect: {kind: FSMeta, mode: Direct, valueFrom: args}
      - spec: "--strip-all"
        kind: flag
        effect: {kind: FSMeta, mode: Direct, valueFrom: args}
      - spec: "--strip-debug"
        kind: flag
        effect: {kind: FSMeta, mode: Direct, valueFrom: args}
      - spec: FILE
        kind: positional
        effect: {kind: FSMeta, mode: Direct, valueFrom: args}

  # --- Debuggers and tracers: gdb, strace, ltrace, valgrind ------------------
  - name: gdb
    dialect: build
    params:
      - spec: "-p"
        kind: option
        effect: {kind: ProcSignal, mode: Direct, valueFrom: flagValue}
      - spec: "--pid"
        kind: option
        effect: {kind: ProcSignal, mode: Direct, valueFrom: flagValue}
      - spec: "-ex"
        kind: option
        effect: {kind: CodeExec, mode: Direct, valueFrom: flagValue}
      - spec: "--eval-command"
        kind: option
        effect: {kind: CodeExec, mode: Direct, valueFrom: flagValue}
      - spec: "-x"
        kind: option
        effect: {kind: CodeExec, mode: Conditional, valueFrom: flagValue}
      - spec: "--command"
        kind: option
        effect: {kind: CodeExec, mode: Conditional, valueFrom: flagValue}
      - spec: "-c"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "--args"
        kind: flag
        effect: {kind: ProcSpawn, mode: Direct, valueFrom: args}
      - spec: BIN
        kind: positional
        effect: {kind: FSRead, mode: Direct, valueFrom: args}

  - name: strace
    dialect: build
    params:
      - spec: "-o"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "-p"
        kind: option
        effect: {kind: ProcSignal, mode: Direct, valueFrom: flagValue}
      - spec: "-e"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "-c"
        kind: flag
        effect: {kind: Stdio, mode: Direct, valueFrom: args}
      - spec: CMD
        kind: positional
        effect: {kind: ProcSpawn, mode: Direct, valueFrom: args}

  - name: ltrace
    dialect: build
    params:
      - spec: "-o"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "-p"
        kind: option
        effect: {kind: ProcSignal, mode: Direct, valueFrom: flagValue}
      - spec: "-e"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "-c"
        kind: flag
        effect: {kind: Stdio, mode: Direct, valueFrom: args}
      - spec: CMD
        kind: positional
        effect: {kind: ProcSpawn, mode: Direct, valueFrom: args}

  - name: valgrind
    dialect: build
    params:
      - spec: "--log-file"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "--xml-file"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "--vgdb"
        kind: option
        effect: {kind: IPC, mode: Direct, valueFrom: flagValue}
      - spec: "--trace-children"
        kind: flag
        effect: {kind: ProcSpawn, mode: Direct, valueFrom: args}
      - spec: CMD
        kind: positional
        effect: {kind: ProcSpawn, mode: Direct, valueFrom: args}

  # --- Diff/patch toolchain: patch, diff, cmp --------------------------------
  - name: patch
    dialect: build
    params:
      - spec: "-i"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "-o"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "-p"
        kind: option
        effect: {kind: FSMeta, mode: Direct, valueFrom: flagValue}
      - spec: "-d"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "-R"
        kind: flag
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: "-b"
        kind: flag
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: "--backup"
        kind: flag
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: "--dry-run"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: TARGET
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}

  - name: diff
    dialect: build
    params:
      - spec: "-r"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-u"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-c"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-q"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-N"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-o"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: FILE1
        kind: positional
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: FILE2
        kind: positional
        effect: {kind: FSRead, mode: Direct, valueFrom: args}

  - name: cmp
    dialect: build
    params:
      - spec: "-l"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-s"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-i"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "-n"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: FILE1
        kind: positional
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: FILE2
        kind: positional
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
