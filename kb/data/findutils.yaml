version: effect-kb/v2
# ---------------------------------------------------------------------------
# GNU findutils and tar.
#
# Sources: the POSIX.1-2017 `find` specification, the GNU findutils manual
# (-delete, -exec, -execdir, -ok, -fprint, -print0), and the GNU tar manual
# (c/x/t modes, -C, --overwrite, --delete, -r/-u append).
# ---------------------------------------------------------------------------
commands:
  - name: find
    dialect: findutils
    params:
      - spec: "-delete"
        kind: flag
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: "-exec"
        kind: option
        effect: {kind: ProcSpawn, mode: Direct, valueFrom: args}
      - spec: "-execdir"
        kind: option
        effect: {kind: ProcSpawn, mode: Direct, valueFrom: args}
      - spec: "-ok"
        kind: option
        effect: {kind: ProcSpawn, mode: Conditional, valueFrom: args}
      - spec: "-print"
        kind: flag
        effect: {kind: Stdio, mode: Direct, valueFrom: args}
      - spec: "-print0"
        kind: flag
        effect: {kind: Stdio, mode: Direct, valueFrom: args}
      - spec: "-fprint"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "-name"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "-type"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "-newer"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: PATH
        kind: positional
        effect: {kind: FSRead, mode: Direct, valueFrom: args}

  - name: xargs
    dialect: findutils
    params:
      - spec: "-0"
        kind: flag
        effect: {kind: ProcSpawn, mode: Direct, valueFrom: args}
      - spec: "-n"
        kind: option
        effect: {kind: ProcSpawn, mode: Direct, valueFrom: flagValue}
      - spec: "-I"
        kind: option
        effect: {kind: ProcSpawn, mode: Direct, valueFrom: flagValue}
      - spec: "-p"
        kind: flag
        effect: {kind: ProcSpawn, mode: Conditional, valueFrom: args}
      - spec: "-r"
        kind: flag
        effect: {kind: ProcSpawn, mode: Direct, valueFrom: args}
      - spec: "-a"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: COMMAND
        kind: positional
        effect: {kind: ProcSpawn, mode: Direct, valueFrom: args}

  - name: tar
    dialect: tar
    params:
      - spec: "-x"
        kind: flag
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: "-c"
        kind: flag
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: "-t"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-C"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "-f"
        kind: option
        effect: {kind: FSWrite, mode: Direct, valueFrom: flagValue}
      - spec: "-z"
        kind: flag
        effect: {kind: ProcSpawn, mode: Direct, valueFrom: args}
      - spec: "-j"
        kind: flag
        effect: {kind: ProcSpawn, mode: Direct, valueFrom: args}
      - spec: "-p"
        kind: flag
        effect: {kind: FSMeta, mode: Direct, valueFrom: args}
      - spec: "-P"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-r"
        kind: flag
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: "-u"
        kind: flag
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: "--overwrite"
        kind: flag
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: "--delete"
        kind: flag
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: FILE
        kind: positional
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
