version: effect-kb/v2
# ---------------------------------------------------------------------------
# Package managers (roadmap task B6).
#
# Sources: the apt(8)/apt-get(8) and dpkg(1) manuals (Debian Policy Manual); the
# yum(8)/dnf(8)/rpm(8) manuals; pacman(8); zypper(8); apk(8); snap(8);
# flatpak(1); pip(1); npm(1); yarn(1); pnpm(1); gem(1); cargo(1); rustc(1); and
# `go help`. Every entry is documented against the `pkgmgr` dialect.
#
# Modelling. Following the git entry in remote.yaml and the svn/hg entries in
# vcs.yaml, every package-manager subcommand is a positional operand:
#   * refreshing the index/metadata and downloading artefacts is NetEgress;
#   * installing, removing, upgrading or otherwise rewriting the local package
#     store is FSWrite;
#   * bookkeeping such as adding a repository, pinning a package, or
#     connecting/disconnecting a snap interface is FSMeta;
#   * read-only queries (list / search / info / audit) are FSRead;
#   * the install subcommand is modelled as FSWrite (it rewrites the local
#     package store); the code-execution surface an install opens is carried
#     instead by the flags that bypass integrity checks or run package scripts
#     explicitly (apt --allow-unauthenticated, yum/dnf --nogpgcheck,
#     dpkg --configure), which are CodeExec (Conditional);
#   * a global or system-wide install typically needs an elevated context and
#     does not stay confined to the user's own tree, hence PrivEsc;
#   * installing a system service (snap enable/disable) makes it outlive the
#     invoking session, hence Persist;
#   * a flag that carries a private index, registry or token is CredAccess;
#   * a subcommand that runs a program or the installed hook is ProcSpawn /
#     ProcSignal.
# Switches that only change how a command is driven (assume-yes, quiet,
# no-confirm) contribute no effect of their own and are therefore omitted.
# ---------------------------------------------------------------------------
commands:
  # --- Debian: apt / apt-get, dpkg -------------------------------------------
  - name: apt
    dialect: pkgmgr
    aliases:
      - apt-get
    params:
      - spec: install
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: remove
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: purge
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: autoremove
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: upgrade
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: full-upgrade
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: update
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: "--download-only"
        kind: flag
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: "-d"
        kind: flag
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: "--fix-broken"
        kind: flag
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: "--purge"
        kind: flag
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: "--allow-unauthenticated"
        kind: flag
        effect: {kind: CodeExec, mode: Conditional, valueFrom: args}
      - spec: "-c"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "-o"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}

  - name: dpkg
