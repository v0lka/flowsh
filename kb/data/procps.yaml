version: effect-kb/v2
# ---------------------------------------------------------------------------
# procps-ng and process/system inspection tools.
#
# Sources: the procps-ng manual (ps, top, free, vmstat, uptime, w, pgrep,
# pkill, killall, watch, pstree, pmap, slabtop), the psmisc manual (killall,
# fuser) and the lsof manual.
#
# Every entry is documented against the `procps` dialect: procps-ng, the
# standard Linux implementation of the process and system utilities.
#
# Everything here that only reports state is read-only (FSRead); the process
# manipulating tools signal processes (ProcSignal); `watch` re-runs a command
# (ProcSpawn).
# ---------------------------------------------------------------------------
commands:
  - name: ps
    dialect: procps
    params:
      - spec: "-a"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-e"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-f"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-l"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-T"
        kind: flag
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-u"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "-p"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "-o"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "-C"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: PID
        kind: positional
        effect: {kind: FSRead, mode: Direct, valueFrom: args}

  - name: top
