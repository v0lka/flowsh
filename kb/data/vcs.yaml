version: effect-kb/v2
# ---------------------------------------------------------------------------
# Version-control clients other than git: Subversion (svn), Mercurial (hg),
# Bazaar (bzr), Fossil (fossil) and Darcs.
#
# Sources: the Subversion book and svn(1), the Mercurial manual (`hg help`),
# Bazaar's bzr(1) / the Breezy manual, the Fossil user manual (`fossil help`)
# and the Darcs manual.
#
# Every entry is documented against the `vcs` dialect. Modelling follows the
# git entry in remote.yaml. Every subcommand is a
# positional operand. Subcommands that talk to a remote are NetEgress; ones
# that rewrite the working copy or the repository are FSWrite; bookkeeping
# such as add/forget/lock is FSMeta; read-only inspection (status/diff/log) is
# FSRead; and switches that carry an identity or a secret (user, author,
# password) are CredAccess.
# ---------------------------------------------------------------------------
commands:
  - name: svn
    dialect: vcs
    params:
      - spec: checkout
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: update
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: commit
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: import
        kind: positional
        effect: {kind: NetEgress, mode: Direct, valueFrom: args}
      - spec: add
        kind: positional
        effect: {kind: FSMeta, mode: Direct, valueFrom: args}
      - spec: delete
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: remove
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: revert
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: merge
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: switch
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: export
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: mkdir
        kind: positional
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: move
        kind: positional
        effect: {kind: FSMeta, mode: Direct, valueFrom: args}
      - spec: copy
        kind: positional
        effect: {kind: FSMeta, mode: Direct, valueFrom: args}
      - spec: propset
        kind: positional
        effect: {kind: FSMeta, mode: Direct, valueFrom: args}
      - spec: cleanup
        kind: positional
        effect: {kind: FSMeta, mode: Direct, valueFrom: args}
      - spec: status
        kind: positional
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: diff
        kind: positional
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: log
        kind: positional
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: blame
        kind: positional
        effect: {kind: FSRead, mode: Direct, valueFrom: args}
      - spec: "-r"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "--revision"
        kind: option
        effect: {kind: FSRead, mode: Direct, valueFrom: flagValue}
      - spec: "-f"
        kind: flag
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: "--force"
        kind: flag
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: "-R"
        kind: flag
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: "--recursive"
        kind: flag
        effect: {kind: FSWrite, mode: Direct, valueFrom: args}
      - spec: "--username"
        kind: option
        effect: {kind: CredAccess, mode: Direct, valueFrom: flagValue}
      - spec: "--password"
        kind: option
        effect: {kind: CredAccess, mode: Direct, valueFrom: flagValue}
      - spec: "--no-auth-cache"
        kind: flag
        effect: {kind: CredAccess, mode: Direct, valueFrom: args}

